name: flake checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  actions: read # lets hestia detect evicted cache entries upfront
  contents: read
  code-quality: write
jobs:
  validate-commits:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Compute initial fetch depth
        id: fetch-depth
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        run: echo "depth=$((PR_COMMITS + 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}
      - name: Fetch validation history
        run: bash .github/scripts/fetch-validation-history.sh "$BASE_SHA"
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          check-owner: "false"
          check-supported: "false"
          ignore-missing-flake-lock: "false"
          fail-mode: "true"
          send-statistics: "false"
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Validate commits
        run: >-
          nix run --no-update-lock-file '.?shallow=1#validate-commits' -- "$BASE_SHA..HEAD"
      - name: Build the coverage report
        id: coverage
        run: |
          COMMIT_OID="${{ github.event.pull_request.head.sha || github.sha }}"
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build --no-update-lock-file ".?rev=$COMMIT_OID&shallow=1#checks.$system.coverage" --out-link coverage
          if [[ -f coverage/cobertura.xml ]]; then
            echo "report=coverage/cobertura.xml" >> "$GITHUB_OUTPUT"
          fi
      # The coverage checks enforce the threshold; this publishes the numbers.
      # Forks cannot upload, and there is no report before the first workspace.
      - name: Upload the coverage report
        if: steps.coverage.outputs.report != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1
        with:
          file: ${{ steps.coverage.outputs.report }}
          language: Rust
          label: code-coverage/cargo-llvm-cov
