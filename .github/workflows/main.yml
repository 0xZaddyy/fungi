name: default branch
on:
  push:
    branches: [main]
permissions:
  actions: read # lets hestia detect evicted cache entries upfront
  contents: read
  code-quality: write
jobs:
  # Checks use the dev profile; building them on main populates the cache for later PRs.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Build the checks
        run: nix flake check --no-update-lock-file --print-build-logs '.?shallow=1'
      - name: Link the coverage report
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build --no-update-lock-file ".?shallow=1#checks.$system.coverage" --out-link coverage
      - name: Upload the coverage report
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1
        with:
          file: coverage/cobertura.xml
          language: Rust
          label: code-coverage/cargo-llvm-cov
  # Packages use the release profile; building them on main populates the cache for later PRs.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Build the packages
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix eval --json --no-update-lock-file ".?shallow=1#packages.$system" --apply builtins.attrNames |
            jq --raw-output --arg system "$system" '.[] | ".?shallow=1#packages.\($system).\(.)"' |
            xargs nix build --no-link --no-update-lock-file --print-build-logs
